<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 800px; height: 800px; overflow: hidden; background: #c9d7f3; }
  .circ {
    position: absolute; inset: 0;
    border-radius: 50%;
    overflow: hidden;
  }
  .circ img {
    position: absolute;
    width: 1300px;
    left: -145px;
    top: -111px;
  }
</style>
</head>
<body>
  <div class="circ">
    <img src="illustration.png">
  </div>
</body>
</html>
