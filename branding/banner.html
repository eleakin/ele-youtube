<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #0c1b2a;
    position: relative;
  }

  /* ---- full-bleed background ---- */
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(1600px 900px at 78% 30%, rgba(31, 122, 140, 0.35), transparent 60%),
      radial-gradient(1400px 1000px at 15% 85%, rgba(19, 58, 92, 0.55), transparent 65%),
      linear-gradient(135deg, #0e2233 0%, #0c1b2a 55%, #091420 100%);
  }

  /* subtle diagonal pinstripes for texture */
  .stripes {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      -35deg,
      rgba(255,255,255,0.018) 0px,
      rgba(255,255,255,0.018) 2px,
      transparent 2px,
      transparent 26px
    );
  }

  /* large ghost vertebrae column motif, right side (decor lives outside safe area) */
  .spine {
    position: absolute;
    right: 120px;
    top: 50%;
    transform: translateY(-50%) rotate(8deg);
    opacity: 0.10;
  }
  .vert {
    width: 210px; height: 92px;
    background: #7fd1c8;
    border-radius: 48px;
    margin: 26px 0;
    position: relative;
  }
  .vert::before, .vert::after {
    content: '';
    position: absolute;
    width: 64px; height: 40px;
    background: #7fd1c8;
    border-radius: 20px;
    top: -18px;
  }
  .vert::before { left: -30px; }
  .vert::after  { right: -30px; }

  /* faint oversized serif letters, left edge (decor) */
  .ghost-letters {
    position: absolute;
    left: 60px; top: 50%;
    transform: translateY(-50%);
    font-size: 700px;
    font-weight: bold;
    color: rgba(255,255,255,0.03);
    letter-spacing: -30px;
    line-height: 1;
  }

  /* gold hairline frame near safe area for structure */
  .frame {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 1650px; height: 520px;
    border: 1px solid rgba(201, 162, 87, 0.28);
  }

  /* ---- SAFE AREA: 1546 x 423, centered ---- */
  .safe {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 1546px; height: 423px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .brand {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 27px;
    font-weight: 700;
    letter-spacing: 5px;
    white-space: nowrap;
    color: #c9a257;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .brand .rule {
    width: 110px; height: 1px;
    background: linear-gradient(90deg, transparent, #c9a257);
  }
  .brand .rule.right {
    background: linear-gradient(90deg, #c9a257, transparent);
  }

  .headline {
    margin-top: 38px;
    font-size: 64px;
    white-space: nowrap;
    line-height: 1.22;
    color: #f4f1ea;
    font-weight: 400;
    max-width: 1500px;
    text-wrap: balance;
  }
  .headline .em {
    font-style: italic;
    color: #7fd1c8;
  }
  .headline .em2 {
    font-style: italic;
    color: #c9a257;
  }

  .sub {
    margin-top: 34px;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 4px;
    white-space: nowrap;
    text-transform: uppercase;
    color: rgba(244, 241, 234, 0.62);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="stripes"></div>

  <div class="ghost-letters">ELE</div>

  <div class="spine">
    <div class="vert"></div>
    <div class="vert"></div>
    <div class="vert"></div>
    <div class="vert"></div>
    <div class="vert"></div>
    <div class="vert"></div>
  </div>

  <div class="frame"></div>

  <div class="safe">
    <div class="brand">
      <span class="rule"></span>
      Everything About Chiropractic &ndash; Patients and DC's
      <span class="rule right"></span>
    </div>
    <div class="headline">
      Everything you wanted to know about <span class="em">Chiropractic</span><br>
      but were <span class="em2">afraid to ask</span>
    </div>
    <div class="sub">Practice Management &middot; Patient Advice &middot; General Chiropractic Information</div>
  </div>
</body>
</html>
