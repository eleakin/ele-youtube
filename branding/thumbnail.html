<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* ============================================================
     THUMBNAIL TEMPLATE — 1280x720
     To make a new thumbnail: edit the three .line spans below,
     then re-render. Keep titles to 3 lines, ~12 chars per line.
     ============================================================ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    position: relative;
    background:
      radial-gradient(900px 600px at 82% 30%, rgba(31, 122, 140, 0.45), transparent 60%),
      radial-gradient(700px 500px at 10% 90%, rgba(19, 58, 92, 0.6), transparent 65%),
      linear-gradient(135deg, #0e2233 0%, #0c1b2a 55%, #091420 100%);
  }

  .stripes {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      -35deg,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 2px,
      transparent 2px,
      transparent 24px
    );
  }

  /* gold accent bar left edge */
  .accent {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 16px;
    background: linear-gradient(180deg, #c9a257, #8a6a2f);
  }

  /* avatar circle, right side */
  .avatar {
    position: absolute;
    right: 48px;
    top: 50%;
    transform: translateY(-50%);
    width: 400px; height: 400px;
    border-radius: 50%;
    border: 10px solid #c9a257;
    overflow: hidden;
    background: #c9d7f3;
    box-shadow: 0 12px 60px rgba(0,0,0,0.6);
  }
  .avatar img {
    position: absolute;
    width: 660px;
    left: -83px;
    top: -63px;
  }

  /* title block */
  .title {
    position: absolute;
    left: 64px;
    top: 50%;
    transform: translateY(-50%);
    width: 720px;
    font-weight: 900;
    font-size: 96px;
    line-height: 1.06;
    letter-spacing: -2px;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 6px 24px rgba(0,0,0,0.55);
  }
  .title .hl   { color: #7fd1c8; }  /* teal highlight */
  .title .hl2  { color: #c9a257; }  /* gold highlight */

  /* bottom brand strip */
  .strip {
    position: absolute;
    left: 64px;
    bottom: 36px;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(244, 241, 234, 0.75);
  }
  .strip b { color: #c9a257; }
</style>
</head>
<body>
  <div class="stripes"></div>
  <div class="accent"></div>

  <div class="title">
    <span class="line">Why I</span><br>
    <span class="line"><span class="hl2">Almost Quit</span></span><br>
    <span class="line">Chiropractic</span>
  </div>

  <div class="avatar">
    <img src="illustration.png">
  </div>

  <div class="strip"><b>ELE</b> &middot; Everything About Chiropractic</div>
</body>
</html>
